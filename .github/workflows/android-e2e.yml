name: Android APK E2E

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android-e2e.yml"
      - "scripts/android-webview-e2e.mjs"

permissions:
  contents: read

jobs:
  android-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install web dependencies
        run: npm ci

      - name: Install Android test toolchain
        run: |
          npm install --no-save \
            @capacitor/core@8.5.2 \
            @capacitor/cli@8.5.2 \
            @capacitor/android@8.5.2 \
            chrome-remote-interface

      - name: Build web application
        env:
          VITE_BASE_PATH: /
        run: npm run build

      - name: Configure Capacitor
        run: |
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "fi.turku.folilivedepartures",
            "appName": "Turku Föli",
            "webDir": "dist",
            "server": {
              "androidScheme": "https"
            },
            "android": {
              "allowMixedContent": false
            }
          }
          JSON

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Configure Android permissions and WebView debugging
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          permissions = [
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_NETWORK_STATE",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.VIBRATE",
              "android.permission.WAKE_LOCK",
          ]

          marker = "<application"
          lines = []
          for permission in permissions:
              token = f'android:name="{permission}"'
              if token not in text:
                  lines.append(
                      f'    <uses-permission android:name="{permission}" />'
                  )

          if lines:
              text = text.replace(
                  marker,
                  "\n".join(lines) + "\n\n    " + marker,
                  1,
              )
          manifest.write_text(text)

          main = Path(
              "android/app/src/main/java/fi/turku/folilivedepartures/MainActivity.java"
          )
          main.write_text(
              """package fi.turku.folilivedepartures;

          import android.os.Bundle;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView.setWebContentsDebuggingEnabled(true);
              }
          }
          """
          )
          PY

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Validate APK structure
        run: |
          set -euxo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" > artifacts-apk-list.txt
          grep -q "assets/public/index.html" artifacts-apk-list.txt
          grep -q "assets/public/manifest.webmanifest" artifacts-apk-list.txt
          grep -q "assets/capacitor.config.json" artifacts-apk-list.txt
          grep -q "AndroidManifest.xml" artifacts-apk-list.txt
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android emulator E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -euxo pipefail
            mkdir -p artifacts/android-e2e

            APK=android/app/build/outputs/apk/debug/app-debug.apk
            PACKAGE=fi.turku.folilivedepartures

            adb wait-for-device
            adb install -r "$APK"
            adb shell pm path "$PACKAGE" | tee artifacts/android-e2e/package-path.txt

            adb shell pm grant "$PACKAGE" android.permission.ACCESS_COARSE_LOCATION
            adb shell pm grant "$PACKAGE" android.permission.ACCESS_FINE_LOCATION
            adb emu geo fix 22.2666 60.4518

            adb logcat -c
            adb shell am force-stop "$PACKAGE"
            adb shell am start -W -n "$PACKAGE/.MainActivity" \
              | tee artifacts/android-e2e/am-start.txt

            sleep 6

            adb shell dumpsys activity activities \
              > artifacts/android-e2e/activity-dump.txt
            grep -q "$PACKAGE" artifacts/android-e2e/activity-dump.txt

            adb shell uiautomator dump /sdcard/window.xml || true
            adb pull /sdcard/window.xml artifacts/android-e2e/window.xml || true
            adb exec-out screencap -p > artifacts/android-e2e/cold-start.png

            PID="$(adb shell pidof "$PACKAGE" | tr -d '\r')"
            test -n "$PID"

            SOCKET=""
            for i in $(seq 1 30); do
              SOCKET="$(adb shell cat /proc/net/unix \
                | tr -d '\r' \
                | awk -v pid="$PID" '$8 ~ ("webview_devtools_remote_" pid "$") { print $8; exit }')"
              if [ -n "$SOCKET" ]; then
                break
              fi
              sleep 1
            done
            test -n "$SOCKET"

            adb forward tcp:9222 "localabstract:$SOCKET"
            curl --fail --retry 20 --retry-delay 1 \
              http://127.0.0.1:9222/json \
              | tee artifacts/android-e2e/cdp-targets.json

            node scripts/android-webview-e2e.mjs \
              | tee artifacts/android-e2e/webview-e2e.log

            adb shell uiautomator dump /sdcard/window-final.xml || true
            adb pull /sdcard/window-final.xml artifacts/android-e2e/window-final.xml || true
            adb exec-out screencap -p > artifacts/android-e2e/final-state.png

            adb logcat -d > artifacts/android-e2e/logcat.txt
            if grep -E "FATAL EXCEPTION|Process: fi\.turku\.folilivedepartures" \
              artifacts/android-e2e/logcat.txt; then
              echo "Detected fatal Android runtime crash"
              exit 1
            fi

            adb shell dumpsys package "$PACKAGE" \
              > artifacts/android-e2e/package-dump.txt

            grep -q "ACCESS_FINE_LOCATION: granted=true" \
              artifacts/android-e2e/package-dump.txt
            grep -q "ACCESS_COARSE_LOCATION: granted=true" \
              artifacts/android-e2e/package-dump.txt

      - name: Upload Android E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e-evidence
          path: |
            artifacts/android-e2e
            artifacts-apk-list.txt
            apk-sha256.txt
            android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 14
