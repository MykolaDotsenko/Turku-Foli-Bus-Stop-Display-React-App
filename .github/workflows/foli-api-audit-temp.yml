name: Temporary Föli API audit

on:
  push:
    branches:
      - docs/foli-api-reference-2026-09-20

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Inspect live Föli endpoint contracts
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const ORIGIN = "https://data.foli.fi";
          const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function request(url, { parse = "json", attempts = 2 } = {}) {
            let lastError;
            for (let attempt = 1; attempt <= attempts; attempt += 1) {
              const controller = new AbortController();
              const timeout = setTimeout(() => controller.abort(), 20_000);
              try {
                const response = await fetch(url, {
                  headers: {
                    Accept: parse === "json" ? "application/json" : "*/*",
                    "User-Agent": "FoliLiveDepartures-API-Audit/2026-09-20 (+https://github.com/MykolaDotsenko/Turku-Foli-Bus-Stop-Display-React-App)",
                  },
                  signal: controller.signal,
                  redirect: "follow",
                });
                const meta = {
                  requestedUrl: url,
                  finalUrl: response.url,
                  status: response.status,
                  ok: response.ok,
                  contentType: response.headers.get("content-type"),
                  cacheControl: response.headers.get("cache-control"),
                  expires: response.headers.get("expires"),
                };
                if (!response.ok) {
                  return { meta, data: null, error: `HTTP ${response.status}` };
                }
                if (parse === "text") {
                  const text = await response.text();
                  return { meta, data: text.slice(0, 500), error: null };
                }
                const text = await response.text();
                try {
                  return { meta, data: JSON.parse(text), error: null };
                } catch (error) {
                  return {
                    meta,
                    data: null,
                    error: `JSON parse failed: ${error.message}; prefix=${text.slice(0, 160)}`,
                  };
                }
              } catch (error) {
                lastError = error;
                if (attempt < attempts) await wait(2000 * attempt);
              } finally {
                clearTimeout(timeout);
              }
            }
            return {
              meta: { requestedUrl: url },
              data: null,
              error: String(lastError?.message || lastError),
            };
          }

          function keys(value) {
            if (!value || typeof value !== "object") return [];
            return Object.keys(value).sort();
          }

          function firstObjectFromMap(value) {
            if (!value || Array.isArray(value) || typeof value !== "object") return null;
            const firstKey = Object.keys(value)[0];
            return firstKey ? { key: firstKey, value: value[firstKey] } : null;
          }

          function summary(result) {
            const { meta, data, error } = result;
            const base = { ...meta, error };
            if (data === null || data === undefined) return base;
            if (Array.isArray(data)) {
              return {
                ...base,
                shape: "array",
                count: data.length,
                sampleType: data[0] === null ? "null" : typeof data[0],
                sampleKeys:
                  data[0] && typeof data[0] === "object" && !Array.isArray(data[0])
                    ? keys(data[0])
                    : [],
                sample: data.slice(0, 2),
              };
            }
            if (typeof data === "object") {
              const entry = firstObjectFromMap(data);
              return {
                ...base,
                shape: "object",
                topLevelKeys: keys(data),
                entryKey: entry?.key || null,
                entryType: entry?.value === null ? "null" : typeof entry?.value,
                entryKeys:
                  entry?.value &&
                  typeof entry.value === "object" &&
                  !Array.isArray(entry.value)
                    ? keys(entry.value)
                    : [],
              };
            }
            return { ...base, shape: typeof data, sample: data };
          }

          function log(label, value) {
            console.log("\n=== " + label + " ===");
            console.log(JSON.stringify(value, null, 2));
          }

          // GTFS entrypoint compatibility audit: docs vs current HTTPS runtime.
          for (const url of [
            `${ORIGIN}/gtfs`,
            `${ORIGIN}/gtfs/`,
            `${ORIGIN}/gtfs/v0`,
            `${ORIGIN}/gtfs/v0/`,
            `${ORIGIN}/gtfs/stops`,
            `${ORIGIN}/gtfs/routes`,
            `${ORIGIN}/gtfs/calendar`,
          ]) {
            log(`GTFS compatibility ${url}`, summary(await request(url)));
          }

          // GTFS metadata + coherent pinned dataset
          const gtfsMeta = await request(`${ORIGIN}/gtfs`);
          log("GTFS /gtfs", summary(gtfsMeta));

          const gtfs = gtfsMeta.data || {};
          const path = String(gtfs.gtfspath || "").startsWith("/")
            ? gtfs.gtfspath
            : `/${gtfs.gtfspath || ""}`;
          const datasetBase =
            gtfs.host && gtfs.latest
              ? `https://${gtfs.host}${path}/${encodeURIComponent(gtfs.latest)}`
              : null;
          log("GTFS resolved dataset", { datasetBase, latest: gtfs.latest, datasets: gtfs.datasets, subpaths: gtfs.subpaths });

          const gtfsResources = {};
          if (datasetBase) {
            for (const resource of [
              "agency",
              "stops",
              "routes",
              "calendar",
              "calendar_dates",
              "trips",
              "stop_times",
              "shapes",
              "trip_notes",
            ]) {
              const result = await request(`${datasetBase}/${resource}`);
              gtfsResources[resource] = result;
              log(`GTFS pinned /${resource}`, summary(result));
            }

            const routes = gtfsResources.routes?.data;
            const stops = gtfsResources.stops?.data;
            const routeId = Array.isArray(routes) ? routes.find((r) => r?.route_id)?.route_id : null;
            const stopId =
              stops && !Array.isArray(stops) && typeof stops === "object"
                ? Object.keys(stops)[0]
                : null;

            const allTrips = await request(`${datasetBase}/trips/all`);
            log("GTFS /trips/all", summary(allTrips));
            const tripSample = Array.isArray(allTrips.data)
              ? allTrips.data.find((trip) => trip?.trip_id)
              : null;
            const tripId = tripSample?.trip_id || null;
            const serviceId = tripSample?.service_id || null;
            const shapeId = tripSample?.shape_id || null;

            if (routeId) {
              log(
                "GTFS /trips/route/{route_id}",
                summary(await request(`${datasetBase}/trips/route/${encodeURIComponent(routeId)}`))
              );
            }
            if (serviceId) {
              log(
                "GTFS /trips/service/{service_id}",
                summary(await request(`${datasetBase}/trips/service/${encodeURIComponent(serviceId)}`))
              );
            }
            if (tripId) {
              log(
                "GTFS /trips/trip/{trip_id}",
                summary(await request(`${datasetBase}/trips/trip/${encodeURIComponent(tripId)}`))
              );
            }

            log(
              "GTFS /stop_times/stop ids",
              summary(await request(`${datasetBase}/stop_times/stop`))
            );
            log(
              "GTFS /stop_times/trip ids",
              summary(await request(`${datasetBase}/stop_times/trip`))
            );
            if (stopId) {
              log(
                "GTFS /stop_times/stop/{stop_id}",
                summary(await request(`${datasetBase}/stop_times/stop/${encodeURIComponent(stopId)}`))
              );
            }
            if (tripId) {
              log(
                "GTFS /stop_times/trip/{trip_id}",
                summary(await request(`${datasetBase}/stop_times/trip/${encodeURIComponent(tripId)}`))
              );
            }

            const shapeIds = await request(`${datasetBase}/shapes`);
            log("GTFS /shapes ids", summary(shapeIds));
            const chosenShape =
              shapeId ||
              (Array.isArray(shapeIds.data) ? shapeIds.data.find(Boolean) : null);
            if (chosenShape) {
              log(
                "GTFS /shapes/{shape_id}",
                summary(await request(`${datasetBase}/shapes/${encodeURIComponent(chosenShape)}`))
              );
            }
          }

          // SIRI Stop Monitoring
          const smCatalog = await request(`${ORIGIN}/siri/sm`);
          log("SIRI /siri/sm stop catalog", summary(smCatalog));
          const smStopId =
            smCatalog.data && !Array.isArray(smCatalog.data)
              ? Object.keys(smCatalog.data).find((id) => /^\d+$/.test(id))
              : null;
          if (smStopId) {
            const sm = await request(`${ORIGIN}/siri/sm/${smStopId}`);
            log("SIRI /siri/sm/{stop_id}", {
              ...summary(sm),
              statusValue: sm.data?.status,
              sysValue: sm.data?.sys,
              resultCount: Array.isArray(sm.data?.result) ? sm.data.result.length : null,
              resultItemKeys:
                Array.isArray(sm.data?.result) && sm.data.result[0]
                  ? keys(sm.data.result[0])
                  : [],
            });
            log(
              "SIRI /siri/sm/{stop_id}/format",
              summary(await request(`${ORIGIN}/siri/sm/${smStopId}/format`))
            );
            log(
              "SIRI /siri/sm/{stop_id}/pretty",
              summary(await request(`${ORIGIN}/siri/sm/${smStopId}/pretty`))
            );
            log(
              "SIRI /siri/sm/{stop_id}/xml",
              summary(await request(`${ORIGIN}/siri/sm/${smStopId}/xml`, { parse: "text" }))
            );
          }

          // SIRI Vehicle Monitoring
          const vm = await request(`${ORIGIN}/siri/vm`);
          const vehicles = vm.data?.result?.vehicles;
          const firstVehicle = firstObjectFromMap(vehicles);
          log("SIRI /siri/vm", {
            ...summary(vm),
            statusValue: vm.data?.status,
            sysValue: vm.data?.sys,
            resultKeys: keys(vm.data?.result),
            vehicleCount:
              vehicles && typeof vehicles === "object" && !Array.isArray(vehicles)
                ? Object.keys(vehicles).length
                : null,
            vehicleId: firstVehicle?.key || null,
            vehicleKeys: keys(firstVehicle?.value),
            previousCallKeys: keys(firstVehicle?.value?.previouscalls?.[0]),
            onwardCallKeys: keys(firstVehicle?.value?.onwardcalls?.[0]),
          });

          // ALERTS
          for (const endpoint of [
            "/alerts",
            "/alerts/messages",
            "/alerts/cancellations",
            "/alerts/categories",
          ]) {
            const result = await request(`${ORIGIN}${endpoint}`);
            const data = result.data;
            const extra =
              endpoint === "/alerts" && data && typeof data === "object"
                ? {
                    servertime: data.servertime,
                    messageCount: Array.isArray(data.messages) ? data.messages.length : null,
                    cancellationCount: Array.isArray(data.cancellations) ? data.cancellations.length : null,
                    globalMessageKeys: keys(data.global_message),
                    emergencyMessageKeys: keys(data.emergency_message),
                    messageKeys: keys(data.messages?.[0]),
                    translationLocales: keys(data.messages?.find((m) => keys(m?.translations).length)?.translations),
                    translationKeys: keys(
                      Object.values(
                        data.messages?.find((m) => keys(m?.translations).length)?.translations || {}
                      )[0]
                    ),
                    imageKeys: keys(data.messages?.find((m) => m?.images?.length)?.images?.[0]),
                    cancellationKeys: keys(data.cancellations?.[0]),
                    cancellationStopKeys: keys(data.cancellations?.[0]?.stops?.[0]),
                  }
                : {};
            log(`ALERTS ${endpoint}`, { ...summary(result), ...extra });
          }

          // GEOJSON discovery and every currently advertised POI layer
          const layersResult = await request(`${ORIGIN}/geojson/layers`);
          log("GEOJSON /geojson/layers", summary(layersResult));
          const layers = layersResult.data?.geojson?.layers;
          if (Array.isArray(layers)) {
            log(
              "GEOJSON advertised layers",
              layers.map((layer) => ({
                name: layer.name,
                url: layer.url,
                metadata: layer.metadata,
              }))
            );
            for (const layer of layers) {
              const rawUrl = String(layer?.url || "");
              if (!rawUrl) continue;
              const url = rawUrl.startsWith("//")
                ? `https:${rawUrl}`
                : rawUrl.startsWith("/")
                  ? `${ORIGIN}${rawUrl}`
                  : rawUrl;
              const result = await request(url);
              const feature = result.data?.features?.[0];
              log(`GEOJSON layer ${rawUrl}`, {
                ...summary(result),
                featureCount: Array.isArray(result.data?.features)
                  ? result.data.features.length
                  : null,
                featureKeys: keys(feature),
                geometryType: feature?.geometry?.type || null,
                propertyKeys: keys(feature?.properties),
                iconKeys: keys(feature?.properties?.icon),
              });
            }
          }

          log("GEOJSON /geojson/poi", summary(await request(`${ORIGIN}/geojson/poi`)));

          for (const endpoint of [
            "/geojson/bounds",
            "/geojson/bounds/ml",
            "/geojson/bounds/strict",
            "/geojson/bounds/strict/ml",
            "/geojson/bounds/compact",
            "/geojson/bounds/compact/ml",
          ]) {
            const result = await request(`${ORIGIN}${endpoint}`);
            const feature = result.data?.features?.[0];
            log(`GEOJSON ${endpoint}`, {
              ...summary(result),
              featureCount: Array.isArray(result.data?.features)
                ? result.data.features.length
                : null,
              geometryType: feature?.geometry?.type || null,
              propertyKeys: keys(feature?.properties),
            });
          }
          NODE
