name: Temporary Föli unused-data value audit

on:
  push:
    branches:
      - audit/foli-unused-data-value-2026-09-20

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Audit static GTFS coverage and selected realtime fields
        shell: bash
        run: |
          python - <<'PY'
          import csv, io, json, urllib.request, zipfile, collections, time, gzip

          UA = "FoliLiveDepartures-UnusedDataAudit/2026-09-20"

          def get(url, timeout=25):
              req = urllib.request.Request(url, headers={"User-Agent": UA, "Accept": "application/json"})
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  body = r.read()
                  headers = dict(r.headers)
                  if (r.headers.get("Content-Encoding", "").lower() == "gzip":
                      body = gzip.decompress(body)
                  return body, headers, r.geturl()

          raw, headers, final = get("https://data.foli.fi/gtfs/gtfs.zip")
          z = zipfile.ZipFile(io.BytesIO(raw))

          def rows(name):
              with z.open(name) as f:
                  text = io.TextIOWrapper(f, encoding="utf-8-sig", newline="")
                  return list(csv.DictReader(text))

          def dist(records, field):
              c = collections.Counter((r.get(field) or "").strip() for r in records)
              return dict(sorted(c.items(), key=lambda kv: (-kv[1], kv[0])))

          stops = rows("stops.txt")
          trips = rows("trips.txt")
          stop_times = rows("stop_times.txt")

          print("=== STATIC_GTFS ===")
          print(json.dumps({
              "zip_final_url": final,
              "files": sorted(z.namelist()),
              "counts": {
                  "stops": len(stops),
                  "trips": len(trips),
                  "stop_times": len(stop_times),
              },
              "stops_fields": list(stops[0].keys()) if stops else [],
              "trips_fields": list(trips[0].keys()) if trips else [],
              "stop_times_fields": list(stop_times[0].keys()) if stop_times else [],
              "distributions": {
                  "stops.location_type": dist(stops, "location_type"),
                  "stops.parent_station_nonempty": sum(1 for r in stops if (r.get("parent_station") or "").strip()),
                  "stops.wheelchair_boarding": dist(stops, "wheelchair_boarding"),
                  "stops.platform_code_nonempty": sum(1 for r in stops if (r.get("platform_code") or "").strip()),
                  "stops.stop_desc_nonempty": sum(1 for r in stops if (r.get("stop_desc") or "").strip()),
                  "stops.stop_url_nonempty": sum(1 for r in stops if (r.get("stop_url") or "").strip()),
                  "stops.zone_id": dist(stops, "zone_id"),
                  "trips.wheelchair_accessible": dist(trips, "wheelchair_accessible"),
                  "trips.bikes_allowed": dist(trips, "bikes_allowed"),
                  "trips.direction_id": dist(trips, "direction_id"),
                  "trips.trip_headsign_nonempty": sum(1 for r in trips if (r.get("trip_headsign") or "").strip()),
                  "stop_times.pickup_type": dist(stop_times, "pickup_type"),
                  "stop_times.drop_off_type": dist(stop_times, "drop_off_type"),
                  "stop_times.timepoint": dist(stop_times, "timepoint"),
                  "stop_times.stop_headsign_nonempty": sum(1 for r in stop_times if (r.get("stop_headsign") or "").strip()),
              }
          }, ensure_ascii=False, indent=2))

          # Realtime sample: spread across the stop catalog to avoid only one locality.
          catalog_raw, _, _ = get("https://data.foli.fi/siri/sm")
          catalog = json.loads(catalog_raw)
          ids = sorted((k for k in catalog if k.isdigit()), key=lambda x: int(x))
          sample_ids = [ids[round(i*(len(ids)-1)/39)] for i in range(40)] if ids else []
          field_counts = collections.Counter()
          true_counts = collections.Counter()
          total_arrivals = 0
          statuses = collections.Counter()

          fields = [
              "destinationdisplay_en","destinationdisplay_sv","vehicleatstop","vehicleref",
              "incongestion","directionname","destinationref","originref","visitnumber",
              "blockref","dataframeref","datedvehiclejourneyref","__directionid","__routeref","__tripref"
          ]

          for stop_id in sample_ids:
              try:
                  body, _, _ = get(f"https://data.foli.fi/siri/sm/{stop_id}", timeout=15)
                  p = json.loads(body)
                  statuses[str(p.get("status"))] += 1
                  for a in p.get("result") or []:
                      total_arrivals += 1
                      for field in fields:
                          v = a.get(field)
                          if v not in (None, "", [], {}):
                              field_counts[field] += 1
                          if v is True:
                              true_counts[field] += 1
              except Exception as e:
                  statuses["ERROR"] += 1
              time.sleep(0.05)

          # Candidate cross-system joins for trip-level static metadata.
          trip_ids = {r["trip_id"] for r in trips}
          candidate_fields = ["__tripref", "datedvehiclejourneyref", "blockref"]
          join_stats = {f: {"present": 0, "matches_trip_id": 0, "examples": []} for f in candidate_fields}

          for stop_id in sample_ids[:12]:
              try:
                  body, _, _ = get(f"https://data.foli.fi/siri/sm/{stop_id}", timeout=15)
                  p = json.loads(body)
                  for a in p.get("result") or []:
                      for field in candidate_fields:
                          v = a.get(field)
                          if v not in (None, ""):
                              v = str(v)
                              join_stats[field]["present"] += 1
                              if v in trip_ids:
                                  join_stats[field]["matches_trip_id"] += 1
                              if len(join_stats[field]["examples"]) < 5:
                                  join_stats[field]["examples"].append(v)
              except Exception:
                  pass

          print("=== SIRI_SAMPLE ===")
          print(json.dumps({
              "sample_stop_count": len(sample_ids),
              "total_arrivals": total_arrivals,
              "statuses": dict(statuses),
              "field_presence": dict(field_counts),
              "true_counts": dict(true_counts),
              "trip_join_stats": join_stats,
          }, ensure_ascii=False, indent=2))

          alerts_raw, _, _ = get("https://data.foli.fi/alerts")
          alerts = json.loads(alerts_raw)
          messages = alerts.get("messages") or []
          active = [m for m in messages if m.get("isactive") is True]
          locales = collections.Counter()
          cats = collections.Counter()
          effects = collections.Counter()
          for m in active:
              for k in (m.get("translations") or {}): locales[k] += 1
              for k in (m.get("categories") or []): cats[k] += 1
              effects[str(m.get("effect") or "")] += 1

          print("=== ALERTS_VALUE ===")
          print(json.dumps({
              "messages_total": len(messages),
              "messages_active": len(active),
              "active_with_images": sum(1 for m in active if m.get("images")),
              "active_with_information": sum(1 for m in active if (m.get("information") or "").strip()),
              "active_with_translations": sum(1 for m in active if m.get("translations")),
              "active_priority_le_100": sum(1 for m in active if isinstance(m.get("priority"), (int,float)) and m["priority"] <= 100),
              "locales": dict(locales),
              "categories": dict(cats),
              "effects": dict(effects),
              "cancellations": len(alerts.get("cancellations") or []),
          }, ensure_ascii=False, indent=2))
          PY
