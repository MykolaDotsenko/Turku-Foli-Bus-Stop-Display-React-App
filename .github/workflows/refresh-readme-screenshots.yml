name: Refresh README screenshots

on:
  push:
    branches:
      - docs/fix-canonical-ci-badge

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: docs/fix-canonical-ci-badge
          fetch-depth: 0

      - name: Download screenshots from latest green master CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/foli-screenshots
          gh api \
            -H "Accept: application/vnd.github+json" \
            /repos/${GITHUB_REPOSITORY}/actions/artifacts/10617874265/zip \
            > /tmp/foli-screenshots.zip
          unzip -o /tmp/foli-screenshots.zip -d /tmp/foli-screenshots

      - name: Refresh README screenshots
        run: |
          cp /tmp/foli-screenshots/foli-desktop.png docs/assets/foli-desktop.png
          cp /tmp/foli-screenshots/foli-mobile-ios.png docs/assets/foli-mobile.png
          rm -f docs/assets/foli-desktop.webp docs/assets/foli-mobile.webp
          python - <<'PY'
          from pathlib import Path
          path = Path("README.md")
          text = path.read_text()
          text = text.replace("docs/assets/foli-desktop.webp", "docs/assets/foli-desktop.png")
          text = text.replace("docs/assets/foli-mobile.webp", "docs/assets/foli-mobile.png")
          path.write_text(text)
          PY

      - name: Commit refreshed screenshots
        run: |
          git add README.md docs/assets
          if git diff --cached --quiet; then
            echo "Screenshots already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: refresh recruiter screenshots from green CI"
          git push origin HEAD:docs/fix-canonical-ci-badge
