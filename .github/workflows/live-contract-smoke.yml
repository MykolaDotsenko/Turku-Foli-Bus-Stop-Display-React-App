name: Live Föli contract smoke

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foli-live-contract
  cancel-in-progress: true

jobs:
  contract-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Verify public Föli API contracts
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function getJson(url, attempts = 3) {
            let lastError;

            for (let attempt = 1; attempt <= attempts; attempt += 1) {
              const controller = new AbortController();
              const timeout = setTimeout(() => controller.abort(), 10_000);

              try {
                const response = await fetch(url, {
                  headers: { Accept: "application/json" },
                  signal: controller.signal,
                });

                if (!response.ok) {
                  throw new Error(`${url} returned HTTP ${response.status}`);
                }

                return await response.json();
              } catch (error) {
                lastError = error;
                if (attempt < attempts) await wait(attempt * 4_000);
              } finally {
                clearTimeout(timeout);
              }
            }

            throw lastError;
          }

          const base = "https://data.foli.fi";

          const stopCatalog = await getJson(`${base}/siri/sm`);
          if (!stopCatalog || Array.isArray(stopCatalog) || typeof stopCatalog !== "object") {
            throw new Error("SIRI stop catalog is not an object.");
          }

          const stopId = Object.keys(stopCatalog).find((id) => /^\d+$/.test(id));
          if (!stopId) throw new Error("SIRI stop catalog has no numeric stop IDs.");

          const monitor = await getJson(`${base}/siri/sm/${stopId}`);
          if (!monitor || typeof monitor !== "object" || Array.isArray(monitor)) {
            throw new Error("Stop Monitoring payload is not an object.");
          }
          if (!["OK", "NO_SIRI_DATA"].includes(monitor.status)) {
            throw new Error(`Unexpected Stop Monitoring status: ${monitor.status}`);
          }
          if (monitor.status === "OK" && !Array.isArray(monitor.result)) {
            throw new Error("Usable Stop Monitoring payload has no result array.");
          }

          const gtfs = await getJson(`${base}/gtfs/`);
          if (
            !gtfs ||
            typeof gtfs !== "object" ||
            Array.isArray(gtfs) ||
            typeof gtfs.host !== "string" ||
            typeof gtfs.gtfspath !== "string" ||
            typeof gtfs.latest !== "string"
          ) {
            throw new Error("GTFS dataset metadata is invalid.");
          }

          const gtfsPath = gtfs.gtfspath.startsWith("/")
            ? gtfs.gtfspath
            : `/${gtfs.gtfspath}`;
          const gtfsBase = `https://${gtfs.host}${gtfsPath}/${encodeURIComponent(
            gtfs.latest
          )}`;

          const [stops, routes] = await Promise.all([
            getJson(`${gtfsBase}/stops`),
            getJson(`${gtfsBase}/routes`),
          ]);

          if (!stops || Array.isArray(stops) || typeof stops !== "object") {
            throw new Error("Pinned GTFS stops payload is not an object.");
          }

          if (!Array.isArray(routes)) {
            throw new Error("Pinned GTFS routes payload is not an array.");
          }

          const alerts = await getJson(`${base}/alerts`);
          if (!alerts || Array.isArray(alerts) || typeof alerts !== "object") {
            throw new Error("Alerts payload is not an object.");
          }

          console.log(
            JSON.stringify(
              {
                checkedStop: stopId,
                stopMonitoringStatus: monitor.status,
                gtfsDataset: gtfs.latest,
                gtfsStops: Object.keys(stops).length,
                gtfsRoutes: routes.length,
                alertKeys: Object.keys(alerts),
              },
              null,
              2
            )
          );
          NODE
