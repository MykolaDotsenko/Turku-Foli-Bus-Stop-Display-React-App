name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install lint gate
        run: npm install --no-save --package-lock=false eslint@9.36.0 eslint-plugin-react@7.37.5 eslint-plugin-react-hooks@7.1.1

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Verify Föli API reference
        run: npm run verify:api-reference

      - name: Build
        run: npm run build

      - name: Verify PWA precache
        run: npm run verify:pwa

      - name: Verify production bundle budget
        run: npm run verify:bundle

  browser-qa:
    needs: unit-build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser QA tooling
        run: npm install --no-save --package-lock=false @playwright/test@1.63.0 @axe-core/playwright@4.13.0

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Cross-browser E2E and accessibility
        run: npm run test:e2e

      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload product screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foli-product-screenshots
          path: artifacts/screenshots
          if-no-files-found: ignore
          retention-days: 14
